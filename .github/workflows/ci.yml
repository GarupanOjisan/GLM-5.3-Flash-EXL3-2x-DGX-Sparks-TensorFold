name: ci
# CPU-only checks: patches apply to the pinned TensorFold source, the image pin matches the
# patch set, and the self-contained tools tests pass against a patched source tree.
# No GPU, no docker, no model downloads (only the checkpoint's chat_template.jinja, a few KB).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  patches-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches to the pinned TensorFold source
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/ashhart/TensorFold.git /tmp/tf
          cd /tmp/tf/src
          for p in "$OLDPWD"/patches/*.patch; do
            echo "applying $(basename "$p")"
            patch -p0 --forward < "$p" > /dev/null || { echo "::error::$(basename "$p") does not apply to TensorFold v0.6.0"; exit 1; }
          done
      - name: Self-contained tools tests (against the patched tree)
        run: |
          MD="$RUNNER_TEMP/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/rev"
          mkdir -p "$MD"
          B=https://huggingface.co/Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold/resolve/main
          for f in chat_template.jinja tokenizer_config.json tokenizer.json; do
            curl -fsSL -o "$MD/$f" "$B/$f"
          done
          python tools/test_chunked_bodies.py --source-root /tmp/tf/src
          python tools/test_effort_tail.py  --source-root /tmp/tf/src --model-dir "$MD"
      - name: Control-token spellings in chat text stay plain text
        run: |
          python -m pip install --disable-pip-version-check tokenizers jinja2 numpy
          MD="$RUNNER_TEMP/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/rev"
          PYTHONPATH=/tmp/tf/src python tools/literal_tokens_check.py "$MD"
      - name: Reply markup is read at its marker tokens
        run: |
          python -m pip install --disable-pip-version-check tokenizers jinja2
          MD="$RUNNER_TEMP/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/rev"
          PYTHONPATH=/tmp/tf/src python tools/reply_ids_check.py "$MD"
      - name: Start-up budget counts the parked pages (synthetic zoneinfo)
        run: PYTHONPATH=/tmp/tf/src python tools/parked_pages_check.py
      - name: Picture budget keeps every picture's cap
        run: PYTHONPATH=/tmp/tf/src python tools/picture_budget_check.py "$PWD"
      - name: iPhone MPO JPEG decodes as frame 0
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/mpo_jpeg_check.py --source-root /tmp/tf/src
      - name: Copy-draft knobs reach the v1.1.4 container
        run: |
          bash -n start.sh start-native.sh start-tf114.sh scripts/config.sh scripts/tf114-env.sh
          python tools/copy_draft_bench.py --self-check
          env -i PATH="$PATH" HOME="$HOME" bash --noprofile --norc -c '
            set -euo pipefail
            source scripts/config.sh
            test "$TF_GLM_COPY" = 1
            test "$TF_GLM_COPY_DRAFTS" = 1
            test "$TF_GLM_COPY_MAX" = 15
            test "$TF_GLM_COPY_MATCH" = 8
            test "$TF_GLM_COPY_CODE" = 1
            test "$TF_GLM_COPY_REPLY_MATCH" = 16
            test "$TF_GLM_WIDE_GRAPHS" = 16
            test "$MALLOC_ARENA_MAX" = 2
            test "$TF_GLM_KEPT_BYTES_GIB" = 1
          '
          env -i PATH="$PATH" HOME="$HOME" COPY=0 COPY_CODE=0 COPY_MAX=7 TF_GLM_COPY_MATCH=4 \
            bash --noprofile --norc -c '
            set -euo pipefail
            source scripts/config.sh
            test "$TF_GLM_COPY" = 0
            test "$TF_GLM_COPY_DRAFTS" = 0
            test "$TF_GLM_COPY_MAX" = 7
            test "$TF_GLM_COPY_MATCH" = 4
            test "$TF_GLM_COPY_CODE" = 0
            test "$TF_GLM_WIDE_GRAPHS" = 0
            test "$TF_GLM_COPY_REPLY_MATCH" = 0
          '
          env -i PATH="$PATH" HOME="$HOME" TF_GLM_COPY=0 TF_GLM_COPY_MAX=9 TF_GLM_COPY_CODE=0 \
            bash --noprofile --norc -c '
            set -euo pipefail
            source scripts/config.sh
            test "$COPY" = 0
            test "$TF_GLM_COPY_DRAFTS" = 0
            test "$COPY_MAX" = 9
            test "$COPY_CODE" = 0
            test "$TF_GLM_WIDE_GRAPHS" = 0
          '
          env -i PATH="$PATH" HOME="$HOME" TF_GLM_COPY_DRAFTS=0 bash --noprofile --norc -c '
            set -euo pipefail
            source scripts/config.sh
            test "$COPY" = 0
            test "$TF_GLM_COPY" = 0
          '
          env -i PATH="$PATH" HOME="$HOME" COPY=1 TF_GLM_COPY_DRAFTS=0 bash --noprofile --norc -c '
            set -euo pipefail
            source scripts/config.sh
            test "$TF_GLM_COPY_DRAFTS" = 1
          '
          out=$(env -i PATH="$PATH" HOME="$HOME" DRY_RUN=1 TF114_IMAGE=example:1.1.4 bash --noprofile --norc ./start-tf114.sh)
          printf '%s\n' "$out"
          for v in TF_GLM_COPY TF_GLM_COPY_DRAFTS TF_GLM_COPY_MAX TF_GLM_COPY_MATCH TF_GLM_COPY_CODE TF_GLM_COPY_REPLY_MATCH TF_GLM_WIDE_GRAPHS; do
            printf '%s\n' "$out" | grep -q -- "-e $v=" || { echo "missing $v"; exit 1; }
          done
          printf '%s\n' "$out" | grep -q -- "-e TF_GLM_COPY_MAX=15"
          printf '%s\n' "$out" | grep -q "nothing was started"
          # 1.0.2's launcher forwards the same copy names
          grep -q 'TF114_COPY_VARS' start-native.sh
      - name: Image pin matches the patch set
        run: |
          # image_hash() from scripts/config.sh: sha256(cat patches/*.patch + IMAGE_EXTRAS)[:12]
          E="$(sed -n 's/^IMAGE_EXTRAS="\(.*\)"/\1/p' scripts/config.sh)"
          H="$( (cat patches/*.patch; echo "$E") | sha256sum | cut -c1-12)"
          T="$(sed -n 's/^IMAGE_TAG="\${IMAGE_TAG:-\(v[^"]*\)}"/\1/p' scripts/config.sh)"
          echo "patch-set hash: $H   pinned IMAGE_TAG: $T"
          if [ "$T" != "v0.6.0-$H" ]; then
            # (wojo fork: no image is published for this patch set; start.sh builds it locally, so a warning)
            echo "::warning::IMAGE_TAG ($T) does not match the current patch set (v0.6.0-$H): prepare.sh builds the image locally."
          fi
